<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hand Tracking - Fruit Shooter 2D</title>

  <!-- MediaPipe CDN Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>🎯 2D Fruit & Bomb Shooter</h1>
    <div id="hud">
      <span>STATE: <strong id="trigger_state">AIMING</strong></span> | 
      <span>SCORE: <strong id="score_display">0</strong></span>
    </div>
  </header>

  <!-- Hidden HTML5 Video stream -->
  <video id="input_video" style="display: none;" playsinline></video>

  <!-- Dual Layout Container -->
  <main class="app-viewport">
    
    <!-- LEFT PANE: Camera & Skeleton Tracking -->
    <section class="pane card">
      <div class="pane-header">📹 Camera Feed</div>
      <div class="canvas-wrapper">
        <canvas id="camera_canvas" width="640" height="480"></canvas>
      </div>
    </section>

    <!-- RIGHT PANE: 2D Fruit Ninja Style Physics Arcade -->
    <section class="pane card">
      <div class="pane-header">🍉 Interactive Target Space</div>
      <div class="canvas-wrapper">
        <canvas id="game_canvas" width="640" height="480"></canvas>
      </div>
    </section>

  </main>

  <p id="status">Status: Initializing camera & tracking system...</p>

  <script type="module" src="script.js"></script>
</body>
</html>
