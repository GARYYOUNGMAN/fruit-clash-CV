<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fruit Clash | Intro</title>
  <link rel="icon" href="https://static.vecteezy.com/system/resources/previews/021/024/064/non_2x/shooting-game-icon-vector.jpg">
  <link rel="stylesheet" href="style.css">
</head>
<body class="intro-body">
  <main class="intro-screen">
    <div class="intro-panel">
      <div class="intro-topbar">
        <span class="brand-pill">FRUIT CLASH</span>
        <span class="status-pill">HAND-TRACKED</span>
      </div>

      <div class="intro-hero">
        <div class="intro-copy">
          <p class="intro-badge">ARCADE MODE</p>
          <h1>Trảm Hoa Quả,
            Làm chủ cuộc chơi!
          </h1>
          <p class="intro-text">
            Nhắm chuẩn, vung chém đúng thời điểm và hạ gục hoa quả trước khi hết giờ. 
            Học thuộc kỹ năng hoặc vào trận chiến ngay!
          </p>

          <div class="button-group">
            <a href="tutorial.html" class="btn btn-primary">HƯỚNG DẪN</a>
            <a href="game.html" class="btn btn-secondary">CHƠI NGAY</a>
          </div>
        </div>

        <div class="intro-preview">
          <div class="preview-card">
            <div class="preview-header">
              <span class="preview-dot dot-green"></span>
              <span class="preview-dot dot-orange"></span>
              <span class="preview-dot dot-red"></span>
            </div>

            <div class="preview-stage">
              <div class="preview-orb orb-one"></div>
              <div class="preview-orb orb-two"></div>
              <div class="preview-orb orb-three"></div>
              <div class="preview-reticle"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
